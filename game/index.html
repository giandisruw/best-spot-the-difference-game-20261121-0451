<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot the Difference — Moonlit Harbor, Clockwork Garden, Lantern Festival</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141021; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #selftest { position: absolute; left: 8px; bottom: 6px; font: 12px monospace; color: #9be7ff; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 4px; display: none; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Spot the difference: two near-identical pictures side by side. Click a difference on either picture."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="selftest"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
